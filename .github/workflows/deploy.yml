name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Quality Assurance (Tests & Lint) ──
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # - name: Run Lint
      #   run: npm run lint

      # - name: Run Unit Tests
      #   run: npm test
        # Note: Ensure "test": "vitest run" is in your package.json

      # Optional: Uncomment if you have integration tests ready
      # - name: Run Integration Tests
      #   run: npm run test:integration
      #   env:
      #     DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

  # ── Job 2: Deploy only on main, only if tests pass ──
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: test # CRITICAL: This ensures deploy only happens if tests pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: .next/cache
          # This key changes whenever your code or dependencies change
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build & Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          # REDIS_URL: ${{ secrets.REDIS_URL }}
          # REDIS_URL: ${{ secrets.REDIS_URL }} 
          NODE_ENV: production
          # NEXT_PUBLIC variables are usually baked in at build time, 
          # but keeping them here ensures the OpenNext build sees them.